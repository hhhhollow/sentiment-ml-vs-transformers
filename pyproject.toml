[project]
name = "sentiment-ml-vs-transformers"
version = "0.1.0"
description = "A reproducible benchmark of TF-IDF, a PyTorch TextCNN, and DistilBERT for sentiment classification."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Yumeng Li", email = "119642582+hhhhollow@users.noreply.github.com" }]
dependencies = [
    "joblib>=1.4.2",
    "matplotlib>=3.9.2",
    "numpy>=2.1.1",
    "pandas>=2.2.2",
    "psutil>=6.0.0",
    "safetensors>=0.4.5",
    "scikit-learn>=1.5.2",
    "seaborn>=0.13.2",
    "torch>=2.6.0",
    "transformers>=4.48.0,<5",
]

[project.scripts]
sentiment-benchmark = "sentiment_benchmark.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_benchmark"]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["network: requires downloading a pinned external artifact"]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
]

[tool.coverage.run]
source = ["sentiment_benchmark"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache", ".venv", "artifacts", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
